name: AMDSMI CI

on:
  pull_request:
    branches: [develop]
    paths:
      - 'projects/amdsmi/**'
      - '.github/workflows/amdsmi-build.yml'
  push:
    branches: [develop]
    paths:
      - 'projects/amdsmi/**'
      - '.github/workflows/amdsmi-build.yml'
  workflow_dispatch:

permissions:
  contents: read
env:
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NONINTERACTIVE_SEEN: true
  BUILD_TYPE: Release
  ROCM_DIR: /opt/rocm

jobs:
  manylinux-build:
    name: Build (Manylinux Gate)
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build AMDSMI
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=$GITHUB_WORKSPACE/projects/amdsmi
          BUILD_DIR=/tmp/amdsmi-build
          PY_BUILD=/opt/python/cp38-cp38/bin/python3

          echo "Installing build prerequisites..."
          dnf -y install git make gcc gcc-c++ cmake ninja-build openssl-devel

          echo "Configuring and building AMDSMI..."
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          cmake "$PROJECT_DIR" \
            -DBUILD_TESTS=ON \
            -DENABLE_ESMI_LIB=ON \
            -DBUILD_PYTHON_LIB=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$PY_BUILD"
          make -j"$(nproc)"

          echo "Building Python wheel..."
          $PY_BUILD -m pip install --upgrade pip setuptools wheel
          cd "$BUILD_DIR/py-interface/python_package"
          rm -rf build dist *.whl *.egg-info
          $PY_BUILD -m pip wheel --no-deps --no-build-isolation -w . .
          echo "Python wheel built: $(ls *.whl)"
          echo "Build gate passed"


  debian-test:
    name: Tests (${{ matrix.os }})
    needs: manylinux-build
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    continue-on-error: true
    strategy:
      max-parallel: 10
      matrix:
        os: [Ubuntu20, Ubuntu22, Ubuntu24, Debian10]
    container:
      image: ${{ vars[format('{0}_DOCKER_IMAGE', matrix.os)] }}
      options: --rm --privileged --device=/dev/kfd --device=/dev/dri --group-add video --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --shm-size=64G --cap-add=SYS_MODULE -v /lib/modules:/lib/modules -u root

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set Project Directory
        run: |
          TARGET_DIR=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/CMakeLists.txt" -exec dirname {} \;)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR=$(find $GITHUB_WORKSPACE -maxdepth 2 -name "CMakeLists.txt" -exec dirname {} \; | head -n 1)
          fi
          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Run AMDSMI Build, Install, and Tests
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/tests/run_amdsmi_build.py" | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "ERROR: run_amdsmi_build.py not found"
            exit 1
          fi
          echo "Using runner script: $SCRIPT"

          ARGS=(
            --project-dir "${{ env.PROJECT_DIR }}"
            --os-label "${{ matrix.os }}"
            --test-results-dir "/tmp/test-results-${{ matrix.os }}"
            --package-manager apt
          )

          if [ "${{ matrix.os }}" = "Debian10" ]; then
            ARGS+=(--debian10-sources)
          fi

          echo "Running: python3 $SCRIPT ${ARGS[*]}"
          python3 "$SCRIPT" "${ARGS[@]}" || {
            EXIT_CODE=$?
            echo ""
            echo "=========================================="
            echo "AMDSMI build/test FAILED for ${{ matrix.os }} (exit code $EXIT_CODE)"
            echo "=========================================="
            echo "Log directory contents:"
            ls -la logs/amdsmi/ 2>/dev/null || true
            exit $EXIT_CODE
          }

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amdsmi-test-results-${{ matrix.os }}
          path: /tmp/test-results-${{ matrix.os }}

      - name: AMDSMI Build Result
        if: always()
        run: |
          echo "=========================================="
          echo "AMDSMI BUILD RESULT for ${{ matrix.os }}"
          echo "=========================================="
          RESULT="/tmp/test-results-${{ matrix.os }}/build_result.txt"
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
            if grep -q "FAILED" "$RESULT"; then
              echo "::error::Build FAILED for ${{ matrix.os }}"
            fi
          else
            echo "No build result file found for ${{ matrix.os }}"
          fi

      - name: AMDSMI Installation Result
        if: always()
        run: |
          echo "=========================================="
          echo "AMDSMI INSTALLATION RESULT for ${{ matrix.os }}"
          echo "=========================================="
          RESULT="/tmp/test-results-${{ matrix.os }}/install_result.txt"
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
            if grep -q "FAILED" "$RESULT"; then
              echo "::error::Installation FAILED for ${{ matrix.os }}"
            fi
          else
            echo "No install result file found for ${{ matrix.os }}"
          fi

      - name: Verify Wheel Site-Packages Result
        if: always()
        run: |
          echo "=========================================="
          echo "VERIFY WHEEL SITE-PACKAGES for ${{ matrix.os }}"
          echo "=========================================="
          RESULT="/tmp/test-results-${{ matrix.os }}/verify_wheel_result.txt"
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
            if grep -q "FAILED" "$RESULT"; then
              echo "::error::Wheel verification FAILED for ${{ matrix.os }}"
            fi
          else
            echo "No verify wheel result file found for ${{ matrix.os }}"
          fi

      - name: AMDSMI Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "AMDSMI TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          FILE="/tmp/test-results-${{ matrix.os }}/amdsmi_tests.log"
          if [ -f "$FILE" ]; then
            cat "$FILE"
            if grep -qiE "FAIL|ERROR" "$FILE"; then
              FAILED=$(grep -iE "FAIL|ERROR" "$FILE" | head -20)
              echo ""
              echo "::error::AMDSMI tests had failures for ${{ matrix.os }}:%0A${FAILED}"
            fi
          else
            echo "No AMDSMI test results found for ${{ matrix.os }}"
          fi

      - name: Integration Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "INTEGRATION TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          FILE="/tmp/test-results-${{ matrix.os }}/integration_test_output.txt"
          if [ -f "$FILE" ]; then
            cat "$FILE"
            if grep -qiE "^FAIL:|^ERROR:" "$FILE"; then
              FAILED=$(grep -iE "^FAIL:|^ERROR:" "$FILE" | head -20)
              echo ""
              echo "::error::Integration tests had failures for ${{ matrix.os }}:%0A${FAILED}"
            fi
          else
            echo "No integration test results found for ${{ matrix.os }}"
          fi

      - name: Unit Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "UNIT TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          FILE="/tmp/test-results-${{ matrix.os }}/unit_test_output.txt"
          if [ -f "$FILE" ]; then
            cat "$FILE"
            if grep -qiE "^FAIL:|^ERROR:" "$FILE"; then
              FAILED=$(grep -iE "^FAIL:|^ERROR:" "$FILE" | head -20)
              echo ""
              echo "::error::Unit tests had failures for ${{ matrix.os }}:%0A${FAILED}"
            fi
          else
            echo "No unit test results found for ${{ matrix.os }}"
          fi

      - name: Perf Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "PERF TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          FILE="/tmp/test-results-${{ matrix.os }}/perf_test_output.txt"
          if [ -f "$FILE" ]; then
            cat "$FILE"
            if grep -qiE "^FAIL:|^ERROR:" "$FILE"; then
              FAILED=$(grep -iE "^FAIL:|^ERROR:" "$FILE" | head -20)
              echo ""
              echo "::error::Perf tests had failures for ${{ matrix.os }}:%0A${FAILED}"
            fi
          else
            echo "No perf test results found for ${{ matrix.os }}"
          fi

      - name: Example DRM Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "EXAMPLE DRM TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          FILE="/tmp/test-results-${{ matrix.os }}/amd_smi_drm_ex.log"
          if [ -f "$FILE" ]; then
            cat "$FILE"
          else
            echo "No DRM example test results found for ${{ matrix.os }}"
          fi

      - name: Example NoDRM Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "EXAMPLE NoDRM TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          FILE="/tmp/test-results-${{ matrix.os }}/amd_smi_nodrm_ex.log"
          if [ -f "$FILE" ]; then
            cat "$FILE"
          else
            echo "No NoDRM example test results found for ${{ matrix.os }}"
          fi

      - name: Failed Tests Summary
        if: always()
        run: |
          echo "=========================================="
          echo "FAILED TESTS SUMMARY for ${{ matrix.os }}"
          echo "=========================================="
          RESULTS_DIR="/tmp/test-results-${{ matrix.os }}"
          ANY_FAILURE=false

          for result_file in "$RESULTS_DIR"/*_result.txt; do
            [ -f "$result_file" ] || continue
            if grep -q "FAILED" "$result_file"; then
              ANY_FAILURE=true
              echo "FAILED: $(basename "$result_file" _result.txt)"
              sed 's/^/  /' "$result_file"
              echo ""
            fi
          done

          # Check test output files for individual test failures
          for test_file in "$RESULTS_DIR"/amdsmi_tests.log "$RESULTS_DIR"/integration_test_output.txt "$RESULTS_DIR"/unit_test_output.txt "$RESULTS_DIR"/perf_test_output.txt; do
            [ -f "$test_file" ] || continue
            FAILS=$(grep -ciE "^FAIL:|\[  FAILED  \]" "$test_file" 2>/dev/null || true)
            if [ "$FAILS" -gt 0 ] 2>/dev/null; then
              ANY_FAILURE=true
              echo "$(basename "$test_file"): $FAILS failure(s) detected"
              grep -iE "^FAIL:|\[  FAILED  \]" "$test_file" | head -30 | sed 's/^/  /'
              echo ""
            fi
          done

          if [ "$ANY_FAILURE" = true ]; then
            echo "::error::One or more tests FAILED for ${{ matrix.os }}. See details above."
          else
            echo "All stages and tests PASSED for ${{ matrix.os }}"
          fi


  rpm-test:
    name: Tests (${{ matrix.os }})
    needs: [manylinux-build, debian-test]
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    continue-on-error: true
    strategy:
      max-parallel: 10
      matrix:
        os:
          - SLES
          - RHEL8
          - RHEL9
          - RHEL10
          - AzureLinux3
          - AlmaLinux8
    container:
      image: ${{ vars[format('{0}_DOCKER_IMAGE', matrix.os)] }}
      options: --rm --privileged --device=/dev/kfd --device=/dev/dri --group-add video --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --shm-size=64G --cap-add=SYS_MODULE -v /lib/modules:/lib/modules -u root

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set Project Directory
        run: |
          TARGET_DIR=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/CMakeLists.txt" -exec dirname {} \;)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR=$(find $GITHUB_WORKSPACE -maxdepth 2 -name "CMakeLists.txt" -exec dirname {} \; | head -n 1)
          fi
          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Run AMDSMI Build, Install, and Tests
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/tests/run_amdsmi_build.py" | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "ERROR: run_amdsmi_build.py not found"
            exit 1
          fi
          echo "Using runner script: $SCRIPT"

          # Determine package manager
          case "${{ matrix.os }}" in
            SLES)          PKG_MGR=zypper ;;
            RHEL8|RHEL9|RHEL10|AlmaLinux8|AzureLinux3) PKG_MGR=dnf ;;
            *)             PKG_MGR=dnf ;;
          esac

          ARGS=(
            --project-dir "${{ env.PROJECT_DIR }}"
            --os-label "${{ matrix.os }}"
            --test-results-dir "/tmp/test-results-${{ matrix.os }}"
            --package-manager "$PKG_MGR"
            --package-format rpm
          )

          # RHEL10 and AlmaLinux8 need QA_RPATHS and more retries
          case "${{ matrix.os }}" in
            RHEL10|AlmaLinux8)
              ARGS+=(--qa-rpaths --retries 5)
              ;;
          esac

          # AzureLinux3: skip setuptools upgrade, install more_itertools
          if [ "${{ matrix.os }}" = "AzureLinux3" ]; then
            ARGS+=(--skip-setuptools-upgrade --install-more-itertools)
          fi

          echo "Running: python3 $SCRIPT ${ARGS[*]}"
          python3 "$SCRIPT" "${ARGS[@]}" || {
            EXIT_CODE=$?
            echo ""
            echo "=========================================="
            echo "AMDSMI build/test FAILED for ${{ matrix.os }} (exit code $EXIT_CODE)"
            echo "=========================================="
            echo "Log directory contents:"
            ls -la logs/amdsmi/ 2>/dev/null || true
            exit $EXIT_CODE
          }

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amdsmi-test-results-${{ matrix.os }}
          path: /tmp/test-results-${{ matrix.os }}

      - name: AMDSMI Build Result
        if: always()
        run: |
          echo "=========================================="
          echo "AMDSMI BUILD RESULT for ${{ matrix.os }}"
          echo "=========================================="
          RESULT="/tmp/test-results-${{ matrix.os }}/build_result.txt"
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
            if grep -q "FAILED" "$RESULT"; then
              echo "::error::Build FAILED for ${{ matrix.os }}"
            fi
          else
            echo "No build result file found for ${{ matrix.os }}"
          fi

      - name: AMDSMI Installation Result
        if: always()
        run: |
          echo "=========================================="
          echo "AMDSMI INSTALLATION RESULT for ${{ matrix.os }}"
          echo "=========================================="
          RESULT="/tmp/test-results-${{ matrix.os }}/install_result.txt"
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
            if grep -q "FAILED" "$RESULT"; then
              echo "::error::Installation FAILED for ${{ matrix.os }}"
            fi
          else
            echo "No install result file found for ${{ matrix.os }}"
          fi

      - name: Verify Wheel Site-Packages Result
        if: always()
        run: |
          echo "=========================================="
          echo "VERIFY WHEEL SITE-PACKAGES for ${{ matrix.os }}"
          echo "=========================================="
          RESULT="/tmp/test-results-${{ matrix.os }}/verify_wheel_result.txt"
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
            if grep -q "FAILED" "$RESULT"; then
              echo "::error::Wheel verification FAILED for ${{ matrix.os }}"
            fi
          else
            echo "No verify wheel result file found for ${{ matrix.os }}"
          fi

      - name: AMDSMI Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "AMDSMI TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          FILE="/tmp/test-results-${{ matrix.os }}/amdsmi_tests.log"
          if [ -f "$FILE" ]; then
            cat "$FILE"
            if grep -qiE "FAIL|ERROR" "$FILE"; then
              FAILED=$(grep -iE "FAIL|ERROR" "$FILE" | head -20)
              echo ""
              echo "::error::AMDSMI tests had failures for ${{ matrix.os }}:%0A${FAILED}"
            fi
          else
            echo "No AMDSMI test results found for ${{ matrix.os }}"
          fi

      - name: Integration Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "INTEGRATION TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          FILE="/tmp/test-results-${{ matrix.os }}/integration_test_output.txt"
          if [ -f "$FILE" ]; then
            cat "$FILE"
            if grep -qiE "^FAIL:|^ERROR:" "$FILE"; then
              FAILED=$(grep -iE "^FAIL:|^ERROR:" "$FILE" | head -20)
              echo ""
              echo "::error::Integration tests had failures for ${{ matrix.os }}:%0A${FAILED}"
            fi
          else
            echo "No integration test results found for ${{ matrix.os }}"
          fi

      - name: Unit Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "UNIT TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          FILE="/tmp/test-results-${{ matrix.os }}/unit_test_output.txt"
          if [ -f "$FILE" ]; then
            cat "$FILE"
            if grep -qiE "^FAIL:|^ERROR:" "$FILE"; then
              FAILED=$(grep -iE "^FAIL:|^ERROR:" "$FILE" | head -20)
              echo ""
              echo "::error::Unit tests had failures for ${{ matrix.os }}:%0A${FAILED}"
            fi
          else
            echo "No unit test results found for ${{ matrix.os }}"
          fi

      - name: Perf Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "PERF TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          FILE="/tmp/test-results-${{ matrix.os }}/perf_test_output.txt"
          if [ -f "$FILE" ]; then
            cat "$FILE"
            if grep -qiE "^FAIL:|^ERROR:" "$FILE"; then
              FAILED=$(grep -iE "^FAIL:|^ERROR:" "$FILE" | head -20)
              echo ""
              echo "::error::Perf tests had failures for ${{ matrix.os }}:%0A${FAILED}"
            fi
          else
            echo "No perf test results found for ${{ matrix.os }}"
          fi

      - name: Example DRM Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "EXAMPLE DRM TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          FILE="/tmp/test-results-${{ matrix.os }}/amd_smi_drm_ex.log"
          if [ -f "$FILE" ]; then
            cat "$FILE"
          else
            echo "No DRM example test results found for ${{ matrix.os }}"
          fi

      - name: Example NoDRM Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "EXAMPLE NoDRM TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          FILE="/tmp/test-results-${{ matrix.os }}/amd_smi_nodrm_ex.log"
          if [ -f "$FILE" ]; then
            cat "$FILE"
          else
            echo "No NoDRM example test results found for ${{ matrix.os }}"
          fi

      - name: Failed Tests Summary
        if: always()
        run: |
          echo "=========================================="
          echo "FAILED TESTS SUMMARY for ${{ matrix.os }}"
          echo "=========================================="
          RESULTS_DIR="/tmp/test-results-${{ matrix.os }}"
          ANY_FAILURE=false

          for result_file in "$RESULTS_DIR"/*_result.txt; do
            [ -f "$result_file" ] || continue
            if grep -q "FAILED" "$result_file"; then
              ANY_FAILURE=true
              echo "FAILED: $(basename "$result_file" _result.txt)"
              sed 's/^/  /' "$result_file"
              echo ""
            fi
          done

          # Check test output files for individual test failures
          for test_file in "$RESULTS_DIR"/amdsmi_tests.log "$RESULTS_DIR"/integration_test_output.txt "$RESULTS_DIR"/unit_test_output.txt "$RESULTS_DIR"/perf_test_output.txt; do
            [ -f "$test_file" ] || continue
            FAILS=$(grep -ciE "^FAIL:|\[  FAILED  \]" "$test_file" 2>/dev/null || true)
            if [ "$FAILS" -gt 0 ] 2>/dev/null; then
              ANY_FAILURE=true
              echo "$(basename "$test_file"): $FAILS failure(s) detected"
              grep -iE "^FAIL:|\[  FAILED  \]" "$test_file" | head -30 | sed 's/^/  /'
              echo ""
            fi
          done

          if [ "$ANY_FAILURE" = true ]; then
            echo "::error::One or more tests FAILED for ${{ matrix.os }}. See details above."
          else
            echo "All stages and tests PASSED for ${{ matrix.os }}"
          fi
